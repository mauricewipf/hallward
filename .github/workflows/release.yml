name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            notes: "false"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            notes: "true"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag cargo=$cargo"
          test -n "$tag"
          test -n "$cargo"
          test "$tag" = "$cargo"

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          mkdir -p dist
          cp target/release/hallward "dist/hallward"
          tar -C dist -czf "hallward-${triple}.tar.gz" hallward
          if command -v sha256sum >/dev/null; then
            sha256sum "hallward-${triple}.tar.gz" > "hallward-${triple}.tar.gz.sha256"
          else
            shasum -a 256 "hallward-${triple}.tar.gz" > "hallward-${triple}.tar.gz.sha256"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hallward-${{ matrix.target }}.tar.gz
            hallward-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Release notes
        if: matrix.notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            HEIC thumbnails still need system `libheif` / `heif-convert`.
            Video thumbnails need system `ffmpeg` (includes `ffprobe` for Live Photo detection).
            Video playback uses **mpv** (required on macOS: `brew install mpv`). Do not use ffplay.
            Stills use **Preview** on macOS; imv / nsxiv / feh / swayimg on Linux.
            macOS binaries are unsigned (allow the app in System Settings → Privacy & Security if Gatekeeper blocks it).
            The Linux binary is glibc, built on Ubuntu 24.04.
            Homebrew: `brew install mauricewipf/hallward/hallward`

  homebrew:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Bump homebrew-hallward tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set on mauricewipf/hallward (fine-grained PAT with Contents write on homebrew-hallward)."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256'
          MAC_SHA=$(awk '{print $1}' hallward-aarch64-apple-darwin.tar.gz.sha256)
          LINUX_SHA=$(awk '{print $1}' hallward-x86_64-unknown-linux-gnu.tar.gz.sha256)
          TAP_DIR=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mauricewipf/homebrew-hallward.git" "$TAP_DIR"
          FORMULA="$TAP_DIR/Formula/hallward.rb"
          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$FORMULA"
          sed -i "s|/releases/download/v[0-9.]*/|/releases/download/v${VERSION}/|g" "$FORMULA"
          sed -i "/aarch64-apple-darwin.tar.gz\"/{n;s/sha256 \".*\"/sha256 \"${MAC_SHA}\"/;}" "$FORMULA"
          sed -i "/x86_64-unknown-linux-gnu.tar.gz\"/{n;s/sha256 \".*\"/sha256 \"${LINUX_SHA}\"/;}" "$FORMULA"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hallward.rb
          if git diff --staged --quiet; then
            echo "Formula already at ${VERSION}; nothing to commit."
            exit 0
          fi
          git commit -m "$(cat <<EOF
hallward ${VERSION}

Created by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
EOF
)"
          git push origin HEAD
