[package]
name = "hallward"
version = "0.1.1"
edition = "2021"
description = "Terminal photo library: miller collections, thumbnail albums, external viewer"
license = "MIT"
repository = "https://github.com/mauricewipf/hallward"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
kamadak-exif = "0.6"
ratatui = "0.29"
ratatui-image = "8.0.2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
