[package]
name = "hallward"
version = "0.1.7"
edition = "2021"
default-run = "hallward"
description = "Terminal photo library: miller collections, thumbnail albums, external viewer"
license = "MIT"
repository = "https://github.com/mauricewipf/hallward"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
crossterm = "0.28"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
indicatif = "0.17"
kamadak-exif = "0.6"
ratatui = "0.29"
ratatui-image = "8.0.2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
walkdir = "2"
